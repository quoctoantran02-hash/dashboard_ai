function fmt(n){ if(n>=1000000) return (n/1000000).toFixed(2)+"M"; if(n>=1000) return (n/1000).toFixed(0)+"K"; return String(Math.round(n)); }
function fmtFull(n){ return Math.round(n).toLocaleString('en-US'); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
function dateStr(d){ return d.toISOString().slice(0,10); }
function apiUrl(path){
  const baseUrl = (window.PNAR_API_BASE_URL || '').replace(/\/+$/, '');
  return baseUrl ? baseUrl + path : path;
}

/* ======================= LOAD DATA (WITH CACHE) ======================= */
const CACHE_KEY = 'PNAR_DASHBOARD_CACHE_V3_SPAM_SENT_DATE';
const CACHE_TIME_KEY = 'PNAR_CACHE_TIMESTAMP';
const EXPIRE_TIME = 24 * 60 * 60 * 1000; // tương đương 86,400,000 ms

function loadData(isRefresh){
  if(isRefresh){
    document.getElementById('refreshBtn').classList.add('spinning');
  } else {
    document.getElementById('loadingState').style.display='flex';
    document.getElementById('dashboardBody').style.display='none';
  }

  if(isDemoMode){
    setTimeout(function(){
      RAW = DEMO_DATA;
      document.getElementById('refreshBtn').classList.remove('spinning');
      document.getElementById('loadingState').style.display='none';
      document.getElementById('dashboardBody').style.display='block';
      if(isRefresh) toast('Đã tải lại dữ liệu giả lập');
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      initFiltersUI();
      applyFilters();
    }, isRefresh ? 300 : 200);
    return;
  }

  // 1. Nếu không phải bấm nút Làm mới, kiểm tra bộ nhớ tạm (localStorage)
  if(!isRefresh){
    const cachedData = localStorage.getItem(CACHE_KEY);
    const cacheTime = localStorage.getItem(CACHE_TIME_KEY);
    const now = Date.now();

    if(cachedData && cacheTime && (now - Number(cacheTime) < EXPIRE_TIME)){
      RAW = JSON.parse(cachedData);
      document.getElementById('loadingState').style.display='none';
      document.getElementById('dashboardBody').style.display='block';
      initFiltersUI();
      applyFilters();
      return; // Hiển thị ngay lập tức, ngắt không cần gọi Google Sheet
    }
  }

  // 2. Nếu bấm Làm mới hoặc chưa có Cache -> gọi API local
  fetch(apiUrl('/api/dashboard-data'), { cache: 'no-store' })
    .then(function(response){
      return response.json().then(function(data){
        if(!response.ok) throw new Error(data.error || 'Không thể tải dữ liệu');
        return data;
      });
    })
    .then(function(data){
      RAW = data || [];

      // Lưu dữ liệu mới vào Cache
      localStorage.setItem(CACHE_KEY, JSON.stringify(RAW));
      localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());

      document.getElementById('refreshBtn').classList.remove('spinning');
      document.getElementById('loadingState').style.display='none';
      document.getElementById('dashboardBody').style.display='block';
      if(isRefresh) toast('Đã cập nhật dữ liệu mới nhất');
      initFiltersUI();
      applyFilters();
    })
    .catch(function(err){
      document.getElementById('refreshBtn').classList.remove('spinning');
      document.getElementById('loadingState').textContent = '⚠️ Lỗi tải dữ liệu: ' + (err && err.message ? err.message : err);
      toast('Lỗi tải dữ liệu');
    });
}

  const chartColsMenu = document.getElementById('chartColsMenu');   // Menu Chỉ số Chart

  const picDonutMetricMenu = document.getElementById('picDonutMetricMenu');
  const topicMetricMenu = document.getElementById('topicMetricMenu');
  const topicFilterMenu = document.getElementById('topicFilterMenu');
  const topicFilterWrapper = document.getElementById('topicFilterWrapper');

    if (!topicFilterMenu) return;
    closeAllMenus();
    topicFilterMenu.classList.add('show');
    const topicSearch = document.getElementById('tableTopicSearch');

  }

  // Hàm bổ trợ đóng tất cả menu khi click ra ngoài
  function closeAllMenus() {
    if (colsMenu) colsMenu.classList.remove('show');
    if (granMenu) granMenu.classList.remove('show');
    if (chartColsMenu) chartColsMenu.classList.remove('show');
    if (productDonutMetricMenu) productDonutMetricMenu.classList.remove('show');
    if (picDonutMetricMenu) picDonutMetricMenu.classList.remove('show');

  [['product', 'productDonutMetricBtn', 'productDonutMetricMenu'],
   ['pic', 'picDonutMetricBtn', 'picDonutMetricMenu']].forEach(([key, buttonId, menuId]) => {
    const button = document.getElementById(buttonId);

  if (topicMetricBtn && topicMetricMenu) {
    topicMetricBtn.addEventListener('click', e => {
      e.stopPropagation();
      const isShow = topicMetricMenu.classList.contains('show');

function wireAIChat(){
  const form = document.getElementById('aiChatForm');
  const input = document.getElementById('aiChatInput');
  const sendButton = document.getElementById('aiChatSendBtn');
  const messages = document.getElementById('aiChatMessages');
  const newChatButton = document.getElementById('aiChatNewBtn');
  if (!form || !input || !sendButton || !messages) return;

  let threadId = '';
  const welcomeMessage = 'Xin chào! Mình là Dior, trợ lý của Đào, mình có thể giúp bạn:\n- Phân tích thực trạng spam PN/AR trong timerange bạn đang filter\n- Giúp bạn tra cứu các user_id bị spam vào 1 ngày cụ thể, của 1 PN cụ thể\n- Gửi báo cáo tổng hợp về những đặc điểm của của các PN mang lại hiệu quả cao\nHoặc bất kì câu hỏi nào về dữ liệu PN, feel free to ask nhé! ^^';

  const addMessage = (text, role) => {
    const message = document.createElement('div');
    message.className = 'ai-chat-message ' + role;
    if (role === 'assistant') {
      const row = document.createElement('div');
      row.className = 'ai-chat-message-row assistant';
      const avatar = document.createElement('img');
      avatar.className = 'ai-chat-avatar';
      avatar.src = '/dior.png';
      avatar.alt = 'Dior';
      row.appendChild(avatar);
      message.textContent = text;
      row.appendChild(message);
      messages.appendChild(row);
    } else {
      message.textContent = text;
      messages.appendChild(message);
    }
    messages.scrollTop = messages.scrollHeight;
    return message;
  };

  input.addEventListener('keydown', event => {
    if (event.key !== 'Enter' || event.altKey || event.isComposing) return;
    event.preventDefault();
    form.requestSubmit();
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message || sendButton.disabled) return;

    addMessage(message, 'user');
    input.value = '';
    input.disabled = true;
    sendButton.disabled = true;
    const pending = addMessage('Đang chờ AI trả lời…', 'assistant');

    try {
      const response = await fetch(apiUrl('/api/ai-chat'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, thread_id: threadId })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Không thể gửi tin nhắn.');
      threadId = data.thread_id || threadId;
      pending.textContent = data.reply || 'AI không trả về nội dung.';
    } catch (error) {
      pending.classList.add('error');
      pending.textContent = error.message || 'Không thể kết nối Agent AI.';
    } finally {
      input.disabled = false;
      sendButton.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }
  });

  if (newChatButton) {
    newChatButton.addEventListener('click', () => {
      threadId = '';
      messages.replaceChildren();
      addMessage(welcomeMessage, 'assistant');
      input.focus();
    });
  }
}
